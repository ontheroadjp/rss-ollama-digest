services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    network_mode: host
    volumes:
      - ..:/data
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_PATH: /data/summaries.db
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434/api/generate}
    read_only: true
    tmpfs:
      - /tmp
  scheduler:
    extends:
      service: frontend
    command: ["python", "../scheduler.py"]
